<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marginmark | Libreria</title><link rel="stylesheet" href="style.css"><body class="library" data-mode="library"><header><img src="icon.svg" alt=""><div class="brand"><h1>Marginmark</h1><p>La tua ricerca. Nel tuo vault.</p></div><button id="open-library" title="Apri la libreria">Libreria ↗</button></header><p id="status" class="status" role="status" hidden></p><div class="layout"><aside class="library-list"><p class="eyebrow">Archivio personale</p><input id="search" class="search" type="search" aria-label="Cerca nell’archivio" placeholder="Cerca testo, note, URL…"><div class="filters"><input id="tag-filter" aria-label="Filtra per tag" placeholder="Tag"><input id="collection-filter" aria-label="Filtra per raccolta" placeholder="Raccolta"></div><label class="checkline"><input id="star-filter" type="checkbox"> Solo preferiti</label><p id="count" class="count"></p><div id="pages"></div><div class="toolbar"><button id="previous">←</button><button id="next">→</button><button id="refresh">Ricarica</button></div><details><summary>Importa un export</summary><p class="muted">JSON Web Highlights. I record già importati vengono saltati.</p><label class="field"><span>Nome del file nel vault</span><input id="import-name" value="webhighlights-backup.json"></label><button id="import">Importa dal vault</button><label class="field"><span>Oppure scegli un JSON</span><input id="import-file" type="file" accept=".json,application/json"></label></details></aside><main id="detail"><div class="empty"><h2>Un posto per quello che conta.</h2><p>Apri una pagina salvata oppure seleziona del testo sul web.</p></div></main></div><script src="common.js"></script><script src="app.js"></script></body></html>
