<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marginmark | PDF</title><link rel="stylesheet" href="vendor/pdf_viewer.css"><link rel="stylesheet" href="style.css"><body class="viewer"><header><img src="icon.svg" alt=""><div class="brand"><h1>PDF nel tuo archivio</h1></div><label class="file-label button">Apri PDF locale<input id="file" type="file" accept=".pdf,application/pdf" hidden></label><input id="page-number" class="page-control" type="number" min="1" value="1" aria-label="Pagina"><span id="page-count" class="muted">/ 0</span><button id="prev" title="Pagina precedente">←</button><button id="next" title="Pagina successiva">→</button><select id="zoom" aria-label="Zoom"><option value="1">100%</option><option value="1.3" selected>130%</option><option value="1.7">170%</option><option value="2">200%</option></select><button id="export-pdf">Esporta PDF evidenziato</button></header><p id="status" class="status" role="status" hidden></p><div class="toolbar" style="padding:0 20px"><input id="url" type="url" placeholder="https://…/documento.pdf" aria-label="URL del PDF" style="flex:1"><button id="open-url">Apri URL</button><input id="find" type="search" placeholder="Cerca nel PDF" aria-label="Cerca testo nel PDF"><button id="find-next">Trova</button></div><div class="viewer-shell"><section class="pdf-workspace"><div id="pdf-page" class="pdf-page"><canvas id="canvas"></canvas><div id="text-layer" class="textLayer"></div><div id="overlay" class="pdf-overlays"></div></div></section><iframe id="notes" class="pdf-notes" title="Note del PDF"></iframe></div><button id="highlight-selection" class="primary pdf-selection" hidden>Evidenzia selezione · Alt+S</button><script src="common.js"></script><script src="anchors.js"></script><script src="surface.js"></script><script src="vendor/pdf-lib.min.js"></script><script src="viewer.js" type="module"></script></body></html>
